name: eyr
description: A new Flutter project.

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  eyr_tools:
    path: ext/custom_plugins/eyr_tools

  json_paramable_annotation:
    path: ext/custom_packages/json_paramable_annotation

  logger: ^2.0.2+1
  json_annotation: ^4.8.1
  go_router: ^14.0.0
  http: ^1.1.0
  connectivity_plus: ^5.0.1
  get_it: ^7.6.4
  flutter_bloc: ^8.1.3
  cupertino_icons: ^1.0.6
  asn1lib: ^1.4.1
  pointycastle: ^3.7.3
  equatable: ^2.0.5
  firebase_messaging: ^14.7.10
  firebase_core: ^2.24.2
  firebase_analytics: ^10.8.9
  meta: ^1.10.0
  intl: ^0.18.1
  formz: ^0.7.0
  loading_animation_widget: ^1.2.1
  flutter_animate: ^4.5.0
  firebase_crashlytics: ^3.4.18

dev_dependencies:
  flutter_test:
    sdk: flutter

  json_paramable_generator:
    path: ext/custom_packages/json_paramable_generator

  flutter_lints: ^3.0.0
  json_serializable: ^6.7.1
  build_runner: ^2.4.6
  build_verify: ^3.1.0
  husky: ^0.1.6
  flutter_launcher_icons: ^0.13.1

flutter:
  # generate: true
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - ext/certs/

  # An image asset can refer to one or more resolution-specific 'variants', see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this 'flutter' section. Each entry in this list should have a
  # 'family' key with the font family name, and a 'fonts' key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
